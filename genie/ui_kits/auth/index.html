function OTPInput({ value, onChange, locked }) {
  const refs = React.useRef([]);
  const set = (i, v) => {
    v = v.replace(/\D/g, '').slice(-1);
    const arr = value.split('');
    arr[i] = v; const next = arr.join('').slice(0, 6);
    onChange(next);
    if (v && refs.current[i + 1]) refs.current[i + 1].focus();
  };
  return (
    <div style={{ display: 'flex', gap: 10 }}>
      {Array.from({ length: 6 }).map((_, i) => (
        <input key={i} ref={(el) => (refs.current[i] = el)} value={value[i] || ''} disabled={locked}
          onChange={(e) => set(i, e.target.value)} inputMode="numeric" maxLength={1}
          style={{ width: 52, height: 60, textAlign: 'center', font: '700 24px var(--font-mono)', border: '1.5px solid ' + (value[i] ? 'var(--color-primary)' : 'var(--border-default)'), borderRadius: 'var(--radius-md)', outline: 'none', color: 'var(--text-strong)', background: locked ? 'var(--gray-50)' : '#fff' }} />
      ))}
    </div>
  );
}

const OTP_DEMO = '123456';
// At least 8 characters with upper case, lower case, a digit and a special character (UC-AUTH-01).
function passwordIssue(p) {
  if (p.length < 8) return 'Mật khẩu tối thiểu 8 ký tự';
  if (!/[A-Z]/.test(p)) return 'Cần ít nhất 1 chữ hoa';
  if (!/[a-z]/.test(p)) return 'Cần ít nhất 1 chữ thường';
  if (!/[0-9]/.test(p)) return 'Cần ít nhất 1 chữ số';
  if (!/[^A-Za-z0-9]/.test(p)) return 'Cần ít nhất 1 ký tự đặc biệt';
  return '';
}
function useCountdown(start, running) {
  const [left, setLeft] = React.useState(start);
  React.useEffect(() => {
    if (!running) return undefined;
    const i = setInterval(() => setLeft((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(i);
  }, [running]);
  return [left, setLeft];
}
const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function GoogleFlow({ open, onClose }) {
  const { Modal } = window.LazadeeDesignSystem_0477b7;
  const [pick, setPick] = React.useState('link');
  const [stage, setStage] = React.useState('choose'); // choose | result
  React.useEffect(() => { if (open) setStage('choose'); }, [open]);
  const c = G_CASES.find((x) => x.id === pick);
  const r = G_RESULT[c.result];
  const enter = () => {
    try { localStorage.setItem(ACCT_KEY, JSON.stringify(c.acct)); } catch (e) {}
    window.location.href = '../storefront/index.html?screen=account&view=logins';
  };
  const cell = (v) => v ? <b>{v}</b> : <b style={{ color: 'var(--red-600)' }}>NULL</b>;
  const row = (r2) => r2 ? <>password_hash = {cell(r2[0])} · google_id = {cell(r2[1])}</> : <i>chưa có dòng nào</i>;
  return (
    <Modal open={open} onClose={onClose} width={520} title="Đăng nhập bằng Google (mô phỏng)"
      footer={stage === 'choose'
        ? <><Button variant="ghost" onClick={onClose}>Huỷ</Button><Button onClick={() => setStage('result')}>Tiếp tục với Google</Button></>
        : <><Button variant="ghost" onClick={() => setStage('choose')}>Thử tình huống khác</Button>{c.result !== 'deny' && <Button iconRight="arrow-right" onClick={enter}>Vào Genie</Button>}</>}>

          <div role="radiogroup" aria-label="Tình huống Google trả về" style={{ display: 'grid', gap: 8 }}>
            {G_CASES.map((x) => (
              <label key={x.id} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', padding: '10px 12px', borderRadius: 'var(--radius-md)', cursor: 'pointer', border: '1.5px solid ' + (pick === x.id ? 'var(--color-primary)' : 'var(--border-default)'), background: pick === x.id ? 'var(--color-primary-tint)' : '#fff' }}>

              const ran = i < c.steps.length, ok = c.steps[i];

function Register({ onDone, onLogin }) {
  const [sso, setSso] = React.useState(null);

  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));
  const strength = (() => {
    const p = f.pw; let s = 0;
    if (p.length >= 8) s++; if (/[A-Z]/.test(p)) s++; if (/[0-9]/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++;
    return s;
  })();
  const submit = () => {
    const e = {};
    if (!f.name.trim()) e.name = 'Nhập họ và tên';
    if (!/.+@.+\..+/.test(f.email)) e.email = 'Email không đúng định dạng';

    if (pwIssue) e.pw = pwIssue;

    if (!f.agree) e.agree = true;
    setErr(e);
    if (Object.keys(e).length === 0) onDone && onDone(f.email);

  const sColor = ['var(--red-500)', 'var(--red-500)', 'var(--gold-500)', 'var(--mint-500)', 'var(--mint-600)'][strength];
  const sLabel = ['Rất yếu', 'Yếu', 'Trung bình', 'Mạnh', 'Rất mạnh'][strength];

      <Input label="Số điện thoại" iconLeft="phone" value={f.phone} onChange={(e) => set('phone', e.target.value)} error={err.phone} placeholder="0901 234 567" />
      <div>
        <PasswordInput label="Mật khẩu" value={f.pw} onChange={(e) => set('pw', e.target.value)} error={err.pw} placeholder="8+ ký tự, có chữ hoa, thường, số, ký tự đặc biệt" />
        {f.pw && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 7 }}>
            <div style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--gray-200)', overflow: 'hidden' }}><div style={{ width: (strength / 4 * 100) + '%', height: '100%', background: sColor, transition: 'width .2s' }} /></div>
            <span style={{ font: 'var(--type-caption)', color: sColor, fontWeight: 600 }}>{sLabel}</span>
          </div>
        )}
      </div>
      <div>
        <PasswordInput label="Nhập lại mật khẩu" value={f.pw2} onChange={(e) => set('pw2', e.target.value)} error={err.pw2} placeholder="Nhập lại mật khẩu" />
        {f.pw2 && !err.pw2 && <div style={{ font: 'var(--type-caption)', marginTop: 5, color: f.pw2 === f.pw ? 'var(--mint-600)' : 'var(--red-600)' }}>{f.pw2 === f.pw ? 'Mật khẩu khớp' : 'Mật khẩu không khớp'}</div>}
      </div>
      <label style={{ display: 'flex', gap: 9, alignItems: 'flex-start', cursor: 'pointer' }}>
        <Checkbox checked={f.agree} onChange={() => set('agree', !f.agree)} />
        <span style={{ font: 'var(--type-caption)', color: err.agree ? 'var(--red-600)' : 'var(--text-muted)', lineHeight: 1.5 }}>Tôi đồng ý với <a style={{ color: 'var(--brand-600)' }}>Điều khoản dịch vụ</a> và <a style={{ color: 'var(--brand-600)' }}>Chính sách bảo mật</a>.</span>
      </label>
      <Button block size="lg" onClick={submit}>Đăng ký</Button>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '4px 0' }}>
        <span style={{ flex: 1, height: 1, background: 'var(--border-default)' }} /><span style={{ font: 'var(--type-caption)', color: 'var(--text-subtle)' }}>Hoặc đăng ký với</span><span style={{ flex: 1, height: 1, background: 'var(--border-default)' }} />
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        <SocialButton brand="google" onPick={setSso} />
        <SocialButton brand="apple" onPick={setSso} />
      </div>
      <SsoDialog provider={sso} onClose={() => setSso(null)} />
      <p style={{ font: 'var(--type-caption)', color: 'var(--text-subtle)', textAlign: 'center', marginTop: 4 }}>Đã có tài khoản? <a style={{ color: 'var(--brand-600)', cursor: 'pointer', fontWeight: 600 }} onClick={onLogin}>Đăng nhập</a></p>
    </div>
  );
}

function Forgot({ email, setEmail, onLogin }) {
  const [stage, setStage] = React.useState('email'); // email | otp | reset | done
  const [otp, setOtp] = React.useState('');
  const [resend, setResend] = useCountdown(60, stage === 'otp');
  const [pw, setPw] = React.useState('');
  const [pw2, setPw2] = React.useState('');
  const [err, setErr] = React.useState({});
  const [tries, setTries] = React.useState(0);
  const checkOtp = () => {
    if (otp === OTP_DEMO) { setStage('reset'); setTries(0); return; }
    const n = tries + 1;
    setTries(n); setOtp('');
    if (n >= 5) setStage('blocked');
  };

  const strength = (() => { const p = pw; let s = 0; if (p.length >= 8) s++; if (/[A-Z]/.test(p)) s++; if (/[0-9]/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p)) s++; return s; })();
  const sColor = ['var(--red-500)', 'var(--red-500)', 'var(--gold-500)', 'var(--mint-500)', 'var(--mint-600)'][strength];
  const sLabel = ['Rất yếu', 'Yếu', 'Trung bình', 'Mạnh', 'Rất mạnh'][strength];
  const submitReset = () => {
    const e = {};
    const issue = passwordIssue(pw);
    if (issue) e.pw = issue;
    else if (pw === 'Genie@123') e.pw = 'Mật khẩu mới phải khác mật khẩu gần nhất';
    if (pw2 !== pw) e.pw2 = 'Mật khẩu nhập lại không khớp';
    setErr(e);
    if (Object.keys(e).length === 0) setStage('done');
  };

  return (
    <Panel>
      <div style={{ maxWidth: 380, margin: '0 auto', width: '100%' }}>
        {stage === 'email' && <>
          <button onClick={onLogin} style={backBtn}><Icon name="chevron-left" size={16} /> Quay lại đăng nhập</button>
          <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 6 }}>Quên mật khẩu</h2>
          <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 24 }}>Nhập email đăng ký để nhận mã xác thực đặt lại mật khẩu.</p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <Input label="Email" iconLeft="mail" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="VD: ban@email.com" />
            <Button block size="lg" onClick={() => { setStage('otp'); setResend(60); }}>Gửi mã xác thực</Button>
          </div>
        </>}

        {stage === 'otp' && <>
          <button onClick={() => setStage('email')} style={backBtn}><Icon name="chevron-left" size={16} /> Đổi email</button>
          <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 6 }}>Xác thực email</h2>
          <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 24 }}>Nếu email <b style={{ color: 'var(--text-body)' }}>{email}</b> tồn tại, mã OTP đã được gửi. Mã có hiệu lực 5 phút. (demo: <span className="code">123456</span>)</p>
          <OTPInput value={otp} onChange={setOtp} />
          <Button block size="lg" style={{ marginTop: 20 }} disabled={otp.length < 6} onClick={checkOtp}>Xác nhận</Button>
          {tries > 0 && <div style={{ color: 'var(--red-600)', font: 'var(--type-body-sm)', marginTop: 12 }}>Mã không đúng. Còn <b>{5 - tries}</b> lần thử.</div>}
          <p style={{ font: 'var(--type-body-sm)', color: 'var(--text-muted)', textAlign: 'center', marginTop: 18 }}>
            {resend > 0 ? <>Gửi lại mã sau <b className="code">{mmss(resend)}</b></> : <a style={{ cursor: 'pointer' }} onClick={() => setResend(60)}>Gửi lại mã</a>}
          </p>
        </>}

        {stage === 'reset' && <>
          <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 6 }}>Đặt mật khẩu mới</h2>
          <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 24 }}>Mật khẩu tối thiểu 8 ký tự, có chữ hoa, chữ thường, chữ số và ký tự đặc biệt.</p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <PasswordInput label="Mật khẩu mới" value={pw} onChange={(e) => setPw(e.target.value)} error={err.pw} placeholder="Tối thiểu 8 ký tự" />
              {pw && <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 7 }}>
                <div style={{ flex: 1, height: 5, borderRadius: 3, background: 'var(--gray-200)', overflow: 'hidden' }}><div style={{ width: (strength / 4 * 100) + '%', height: '100%', background: sColor, transition: 'width .2s' }} /></div>
                <span style={{ font: 'var(--type-caption)', color: sColor, fontWeight: 600 }}>{sLabel}</span>
              </div>}
            </div>
            <PasswordInput label="Xác nhận mật khẩu mới" value={pw2} onChange={(e) => setPw2(e.target.value)} error={err.pw2} placeholder="Nhập lại mật khẩu" />
            <Button block size="lg" onClick={submitReset}>Cập nhật mật khẩu</Button>
          </div>
        </>}

        {stage === 'blocked' && <div style={{ textAlign: 'center' }}>
          <div style={{ width: 80, height: 80, borderRadius: '50%', background: 'var(--red-50)', color: 'var(--red-600)', display: 'grid', placeItems: 'center', margin: '0 auto 22px' }}><Icon name="lock" size={40} /></div>
          <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 10 }}>Tạm khóa khôi phục mật khẩu</h2>
          <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 24 }}>Bạn đã nhập sai mã OTP 5 lần. Vui lòng thử lại sau 30 phút.</p>
          <Button block size="lg" variant="secondary" onClick={onLogin}>Quay lại đăng nhập</Button>
        </div>}

        {stage === 'done' && <div style={{ textAlign: 'center' }}>
          <div style={{ width: 80, height: 80, borderRadius: '50%', background: 'var(--mint-50)', color: 'var(--mint-600)', display: 'grid', placeItems: 'center', margin: '0 auto 22px' }}><Icon name="circle-check" size={42} /></div>
          <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 10 }}>Đặt lại mật khẩu thành công</h2>
          <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 24 }}>Bạn có thể đăng nhập bằng mật khẩu mới.</p>
          <Button block size="lg" onClick={onLogin}>Đăng nhập ngay</Button>
        </div>}
      </div>
    </Panel>
  );
}

function Auth() {
  const [step, setStep] = React.useState(new URLSearchParams(location.search).get('screen') || 'login'); // login | register | otp | forgot | locked
  const [email, setEmail] = React.useState('ban@email.com');
  const [otp, setOtp] = React.useState('');
  const [attempts, setAttempts] = React.useState(0);
  const [resend, setResend] = useCountdown(60, step === 'otp');
  const [otpLeft, setOtpLeft] = useCountdown(300, step === 'otp');
  const [lockLeft, setLockLeft] = useCountdown(15 * 60, step === 'locked');
  const [lockedBy, setLockedBy] = React.useState('OTP');
  const [loginMode, setLoginMode] = React.useState('password'); // password | otp
  const [pw, setPw] = React.useState('');
  const [pwError, setPwError] = React.useState('');
  const [pwFails, setPwFails] = React.useState(0);
  const [otpFor, setOtpFor] = React.useState('login'); // login | register
  const [notice, setNotice] = React.useState(null); // { title, text, ok }
  const [sso, setSso] = React.useState(null);

  // mock: Genie@123 logs in; 5 wrong passwords lock the account
  const loginPassword = () => {
    if (!/.+@.+\..+/.test(email)) { setPwError('Email không đúng định dạng'); return; }
    if (pw === 'Genie@123') { window.location.href = '../storefront/index.html'; return; }
    const n = pwFails + 1;
    setPwFails(n); setPw('');
    if (n >= 5) { setLockedBy('mật khẩu'); setLockLeft(15 * 60); setStep('locked'); return; }
    setPwError('Email hoặc mật khẩu không chính xác. Còn ' + (5 - n) + ' lần thử.');
  };

  const verify = () => {
    if (otpLeft === 0) { setOtp(''); return; }
    if (otp === OTP_DEMO) {
      setOtp(''); setAttempts(0);
      window.location.href = '../storefront/index.html';
      return;
    }
    const n = attempts + 1;
    setAttempts(n);
    setOtp('');
    if (n >= 5) {
      if (otpFor === 'register') { setStep('register'); setAttempts(0); setNotice({ title: 'Đăng Ký Thất Bại', text: 'Bạn đã nhập sai mã OTP quá 5 lần. Vui lòng đăng ký lại.', ok: false }); return; }
      setLockedBy('mã OTP'); setLockLeft(15 * 60); setStep('locked');
    }
  };

  const noticeBox = notice && (
    <div role="status" style={{ display: 'flex', gap: 9, alignItems: 'flex-start', padding: '11px 13px', marginBottom: 18, borderRadius: 'var(--radius-md)', background: notice.ok ? 'var(--mint-50)' : 'var(--red-50)', color: notice.ok ? 'var(--mint-600)' : 'var(--red-600)', font: 'var(--type-body-sm)' }}>
      <Icon name={notice.ok ? 'circle-check' : 'circle-alert'} size={17} style={{ flex: 'none', marginTop: 1 }} /><span><b>{notice.title}.</b> {notice.text}</span>
    </div>
  );

  if (step === 'login') return (
    <Panel>
      <div style={{ maxWidth: 360, margin: '0 auto', width: '100%' }}>
        {noticeBox}
        <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 6 }}>Đăng nhập</h2>
        <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 18 }}>{loginMode === 'otp' ? 'Nhập Email để nhận mã OTP.' : 'Đăng nhập bằng Email và mật khẩu.'}</p>
        <div style={{ display: 'flex', gap: 4, background: 'var(--gray-100)', padding: 4, borderRadius: 'var(--radius-md)', marginBottom: 18 }}>
          {[['password', 'Mật khẩu'], ['otp', 'Mã OTP']].map(([id, label]) => <button key={id} onClick={() => { setLoginMode(id); setPwError(''); }} style={{ flex: 1, height: 34, border: 0, borderRadius: 'var(--radius-sm)', cursor: 'pointer', background: loginMode === id ? '#fff' : 'transparent', color: loginMode === id ? 'var(--text-strong)' : 'var(--text-muted)', boxShadow: loginMode === id ? 'var(--shadow-sm)' : 'none', font: 'var(--weight-semibold) var(--text-sm) var(--font-sans)' }}>{label}</button>)}
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <Input label="Email" iconLeft="mail" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="VD: ban@email.com" />
          {loginMode === 'password'
            ? <>
                <PasswordInput label="Mật khẩu" value={pw} onChange={(e) => { setPw(e.target.value); setPwError(''); }} error={pwError} placeholder="Mật khẩu của bạn" />
                <Button block size="lg" disabled={!pw} onClick={loginPassword}>Đăng nhập</Button>
                <div style={{ font: 'var(--type-caption)', color: 'var(--text-subtle)', textAlign: 'center' }}>Demo: mật khẩu <span className="code">Genie@123</span></div>
              </>
            : <Button block size="lg" onClick={() => { setOtpFor('login'); setStep('otp'); setResend(60); setOtpLeft(300); }}>Gửi mã OTP</Button>}
        </div>
        <div style={{ textAlign: 'right', marginTop: 10 }}>
          <a style={{ font: 'var(--type-body-sm)', color: 'var(--brand-600)', cursor: 'pointer', fontWeight: 600 }} onClick={() => setStep('forgot')}>Quên mật khẩu?</a>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '24px 0' }}>
          <span style={{ flex: 1, height: 1, background: 'var(--border-default)' }} /><span style={{ font: 'var(--type-caption)', color: 'var(--text-subtle)' }}>HOẶC</span><span style={{ flex: 1, height: 1, background: 'var(--border-default)' }} />
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <SocialButton brand="google" onPick={setSso} />
          <SocialButton brand="apple" onPick={setSso} />
        </div>
        <SsoDialog provider={sso} onClose={() => setSso(null)} />
        <p style={{ font: 'var(--type-caption)', color: 'var(--text-subtle)', textAlign: 'center', marginTop: 28 }}>Chưa có tài khoản? <a style={{ color: 'var(--brand-600)', cursor: 'pointer', fontWeight: 600 }} onClick={() => setStep('register')}>Đăng ký người mua</a> · <a href="../storefront/index.html?screen=seller" style={{ color: 'var(--brand-600)', cursor: 'pointer' }}>Mở shop</a></p>
      </div>
    </Panel>
  );

  if (step === 'register') return (
    <Panel>
      <div style={{ maxWidth: 384, margin: '0 auto', width: '100%' }}>
        <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 6 }}>Đăng ký tài khoản</h2>
        <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 22 }}>Tạo tài khoản người mua Genie miễn phí.</p>
        {noticeBox}
        <Register onDone={(mail) => { setNotice(null); setEmail(mail); setOtpFor('register'); setStep('otp'); setResend(60); setOtpLeft(300); }} onLogin={() => { setNotice(null); setStep('login'); }} />
      </div>
    </Panel>
  );

  if (step === 'forgot') return <Forgot email={email} setEmail={setEmail} onLogin={() => setStep('login')} />;

  if (step === 'otp') return (
    <Panel>
      <div style={{ maxWidth: 380, margin: '0 auto', width: '100%' }}>
        <button onClick={() => { setStep('login'); setAttempts(0); }} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, border: 0, background: 'transparent', color: 'var(--text-muted)', font: 'var(--type-body-sm)', cursor: 'pointer', marginBottom: 20 }}><Icon name="chevron-left" size={16} /> Đổi Email</button>
        <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 6 }}>Nhập mã OTP</h2>
        <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 24 }}>Mã 6 số đã gửi tới địa chỉ email <b style={{ color: 'var(--text-body)' }}>{email}</b>. (demo: <span className="code">123456</span>)</p>
        <OTPInput value={otp} onChange={setOtp} />
        <div style={{ font: 'var(--type-body-sm)', color: otpLeft === 0 ? 'var(--red-600)' : 'var(--text-muted)', marginTop: 12 }}>{otpLeft === 0 ? 'Mã OTP đã hết hiệu lực, vui lòng gửi lại mã.' : <>Mã hết hạn sau <b className="code">{mmss(otpLeft)}</b></>}</div>
        {attempts > 0 && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--red-600)', font: 'var(--type-body-sm)', marginTop: 14 }}>
            <Icon name="circle-alert" size={15} /> Mã không đúng. Còn <b style={{ margin: '0 3px' }}>{5 - attempts}</b> lần thử trước khi khoá.
          </div>
        )}
        <Button block size="lg" style={{ marginTop: 20 }} disabled={otp.length < 6} onClick={verify}>Xác nhận</Button>
        <p style={{ font: 'var(--type-body-sm)', color: 'var(--text-muted)', textAlign: 'center', marginTop: 18 }}>
          {resend > 0 ? <>Gửi lại mã sau <b className="code">{mmss(resend)}</b></> : <a style={{ cursor: 'pointer' }} onClick={() => { setResend(60); setOtpLeft(300); }}>Gửi lại mã OTP</a>}
        </p>
      </div>
    </Panel>
  );

  // locked
  return (
    <Panel>
      <div style={{ maxWidth: 380, margin: '0 auto', width: '100%', textAlign: 'center' }}>
        <div style={{ width: 80, height: 80, borderRadius: '50%', background: 'var(--red-50)', color: 'var(--red-600)', display: 'grid', placeItems: 'center', margin: '0 auto 22px' }}><Icon name="lock" size={40} /></div>
        <h2 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 10 }}>Tài khoản tạm khoá</h2>
        <p style={{ font: 'var(--type-body)', color: 'var(--text-muted)', marginBottom: 8 }}>Bạn đã nhập sai {lockedBy} <b style={{ color: 'var(--red-600)' }}>5 lần</b>. Vì lý do bảo mật, tài khoản bị khoá tạm thời.</p>
        <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'var(--red-50)', color: 'var(--red-600)', borderRadius: 'var(--radius-md)', padding: '10px 16px', font: 'var(--weight-semibold) var(--text-base) var(--font-sans)', margin: '8px 0 24px' }}>
          <Icon name="clock" size={18} /> Thử lại sau <span className="code">{mmss(lockLeft)}</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <Button block size="lg" variant="secondary" iconLeft="shield-check">Xác minh qua email</Button>
          <Button block variant="ghost" iconLeft="circle-help">Liên hệ hỗ trợ</Button>
        </div>
      </div>
    </Panel>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<Auth />);
</script>
</body>
</html>

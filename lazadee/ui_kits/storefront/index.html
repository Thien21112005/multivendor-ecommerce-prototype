<!-- @dsCard group="Storefront" viewport="1280x900" name="Customer storefront" subtitle="Home · product detail · multi-vendor cart · checkout" -->
<!-- @startingPoint section="Storefront" subtitle="Lazadee customer storefront — home, product, cart, checkout" viewport="1280x900" -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazadee — Storefront</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:var(--surface-page)}
  #app{min-height:100vh}
  *::-webkit-scrollbar{height:8px;width:8px}
  *::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}
  @keyframes lz-spin{to{transform:rotate(360deg)}}
  .lz-spin{animation:lz-spin .8s linear infinite}
  @keyframes lz-typing{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .lz-typing-dot{display:inline-block;animation:lz-typing 1s infinite ease-in-out}
  @keyframes lzSlideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Discover.jsx"></script>
<script type="text/babel" src="ProductDetail.jsx"></script>
<script type="text/babel" src="Cart.jsx"></script>
<script type="text/babel" src="VoucherPicker.jsx"></script>
<script type="text/babel" src="Checkout.jsx"></script>
<script type="text/babel" src="Account.jsx"></script>
<script type="text/babel" src="OrderTracking.jsx"></script>
<script type="text/babel" src="AddressModal.jsx"></script>
<script type="text/babel" src="Shop.jsx"></script>
<script type="text/babel" src="Search.jsx"></script>
<script type="text/babel" src="BecomeSeller.jsx"></script>
<script type="text/babel" src="ChatWidget.jsx"></script>
<script type="text/babel" src="Category.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel" src="ReviewModal.jsx"></script>
<script src="pages-data.js"></script>
<script type="text/babel">
const { Icon } = window.LazadeeDesignSystem_0477b7;

const qp = (k) => new URLSearchParams(location.search).get(k);
const LZ_INIT = qp('screen') || 'home';
function App() {
  const [screen, setScreen] = React.useState(LZ_INIT);     // home | discover | product | cart | checkout | done | payfail | account | tracking | shop | search | seller | page | category
  const [productId, setProductId] = React.useState(LZ_INIT === 'product' ? qp('product') || 'p1' : null);
  const [trackId, setTrackId] = React.useState(qp('order') || null);
  const [shopId, setShopId] = React.useState(qp('shop') || 'techzone');
  const [searchScope, setSearchScope] = React.useState(qp('scope') || 'all');
  const [searchShopId, setSearchShopId] = React.useState(qp('shop') || null);
  const [cart, setCart] = React.useState(() => seedCart());
  const [query, setQuery] = React.useState(qp('q') || '');
  const [acctView, setAcctView] = React.useState(qp('view') || null);
  const [pageId, setPageId] = React.useState(qp('id') || 'help-center');
  const [catName, setCatName] = React.useState(qp('cat') || 'Điện tử');
  const [loggedIn, setLoggedIn] = React.useState(qp('guest') !== '1');
  const [loginPrompt, setLoginPrompt] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [pendingNotif, setPendingNotif] = React.useState(null);
  const [reviewOrder, setReviewOrder] = React.useState(null);
  const [reviewedIds, setReviewedIds] = React.useState([]);
  const [buyNowKey, setBuyNowKey] = React.useState(null);
  const [checkoutKeys, setCheckoutKeys] = React.useState(null);
  const [receipt, setReceipt] = React.useState(null);
  // one voucher of each tier pre-applied so the 3-layer stack is visible from the first view
  const [voucherSel, setVoucherSel] = React.useState({ platform: 'v1', freeship: 'v2', shop: { techzone: 'v3' } });
  const [useXu, setUseXu] = React.useState(false);

  const showToast = (message, type) => {
    setToast({ message, type: type || 'success' });
    clearTimeout(window.__lzToast);
    window.__lzToast = setTimeout(() => setToast(null), 2200);
  };
  React.useEffect(() => {
    const onToast = (e) => e.detail && showToast(e.detail.message, e.detail.type);
    const onPop = () => {
      setScreen(qp('screen') || 'home');
      if (qp('product')) setProductId(qp('product'));
      if (qp('order')) setTrackId(qp('order'));
      if (qp('shop')) setShopId(qp('shop'));
      if (qp('view')) setAcctView(qp('view'));
      if (qp('id')) setPageId(qp('id'));
      if (qp('cat')) setCatName(qp('cat'));
      setQuery(qp('q') || '');
    };
    window.addEventListener('show_toast', onToast);
    window.addEventListener('popstate', onPop);
    return () => { window.removeEventListener('show_toast', onToast); window.removeEventListener('popstate', onPop); };
  }, []);

  // Keep the current screen in the URL so reload and browser back work.
  React.useEffect(() => {
    const u = new URL(location.href);
    const set = (k, v) => (v ? u.searchParams.set(k, v) : u.searchParams.delete(k));
    set('screen', screen);
    set('product', screen === 'product' && productId);
    set('order', screen === 'tracking' && trackId);
    set('shop', (screen === 'shop' && shopId) || (screen === 'search' && searchScope === 'shop' && searchShopId));
    set('q', screen === 'search' && query);
    set('scope', screen === 'search' && searchScope);
    set('id', screen === 'page' && pageId);
    set('cat', screen === 'category' && catName);
    set('view', screen === 'account' && acctView);
    if (u.href !== location.href) history.pushState({}, '', u);
  }, [screen, productId, trackId, shopId, searchScope, searchShopId, query, pageId, catName, acctView]);

  const cartCount = cart.length;
  const go = (s, arg) => { if (s === 'page' && arg) setPageId(arg); setScreen(s); window.scrollTo(0, 0); };
  const goAccount = (v) => { setAcctView(v); go('account'); };
  const open = (id) => { setProductId(id); go('product'); };
  const requireLogin = () => setLoginPrompt(true);
  const toLogin = () => { window.location.href = '../auth/index.html?screen=login'; };
  const logout = () => { setLoggedIn(false); setCart([]); go('home'); };
  const addToCart = (item) => {
    setCart((c) => {
      const i = c.findIndex((l) => l.key === item.key);
      if (i >= 0) { const n = [...c]; n[i] = { ...n[i], qty: n[i].qty + item.qty }; return n; }
      return [...c, item];
    });
    showToast('Sản phẩm đã được thêm vào Giỏ hàng');
  };
  const buyAgain = (items) => {
    items.forEach((it) => {
      const p = window.LZ.byId(it.productId);
      addToCart({ key: it.productId + '|' + it.variant, productId: it.productId, vendorId: p.v, title: it.title, img: it.img, price: it.price, original: p.original, variant: it.variant, qty: it.qty, stock: 50 });
    });
    showToast('Đã thêm các sản phẩm vào giỏ hàng');
    go('cart');
  };
  const chat = (vendorId) => window.dispatchEvent(new CustomEvent('open_chat', { detail: { vendorId } }));

  const Header = window.LZHeader;
  const track = (id) => { setTrackId(id); go('tracking'); };
  const review = (id) => { const o = window.LZ.orderById(id); if (o) setReviewOrder(o); };
  const openShop = (vid) => { setShopId(vid); go('shop'); };
  const openCategory = (name) => { setCatName(name); go('category'); };
  const runSearch = (q, vid) => {
    setQuery(q || '');
    if (vid) { setSearchShopId(vid); setSearchScope('shop'); }
    else { setSearchScope('all'); }
    go('search');
  };
  const checkoutLines = checkoutKeys ? cart.filter((l) => checkoutKeys.includes(l.key)) : cart;

  let body = null;
  if (screen === 'home') body = <window.LZHome onOpen={open} onMore={() => go('discover')} onCategory={openCategory} />;
  else if (screen === 'discover') body = <window.LZDiscover initialPage={2} onOpen={open} onHome={() => go('home')} />;
  else if (screen === 'product') body = <window.LZProductDetail id={productId} loggedIn={loggedIn} onRequireLogin={requireLogin} onOpen={open} onAdd={addToCart} onGoCart={(key) => { setBuyNowKey(key); go('cart'); }} onShop={openShop} onCategory={openCategory} onHome={() => go('home')} onChat={chat} />;
  else if (screen === 'cart') body = <window.LZCart cart={cart} setCart={setCart} voucherSel={voucherSel} setVoucherSel={setVoucherSel} useXu={useXu} setUseXu={setUseXu} buyNowKey={buyNowKey} clearBuyNow={() => setBuyNowKey(null)} onCheckout={(keys) => { setCheckoutKeys(keys); go('checkout'); }} onContinue={() => go('home')} onOpen={open} onShop={openShop} onChat={chat} />;
  else if (screen === 'checkout') body = <window.LZCheckout cart={checkoutLines} voucherSel={voucherSel} setVoucherSel={setVoucherSel} useXu={useXu} setUseXu={setUseXu} onPlaced={(r) => { setReceipt(r); setCart((c) => c.filter((l) => !r.keys.includes(l.key))); go('done'); }} onFailed={() => go('payfail')} onBack={() => go('cart')} />;
  else if (screen === 'done') body = <OrderDone receipt={receipt} onHome={() => go('home')} onOrders={() => goAccount('orders')} onTrack={(id) => track(window.LZ.orderById(id) ? id : 'ORD-2412-0044')} />;
  else if (screen === 'payfail') body = <PaymentFailed onRetry={() => go('checkout')} onCart={() => go('cart')} onHome={() => go('home')} />;
  else if (screen === 'account') body = <window.LZAccount initialView={acctView} pendingNotif={pendingNotif} onClearPendingNotif={() => setPendingNotif(null)} reviewedIds={reviewedIds} onTrack={track} onOpen={open} onReview={review} onBuyAgain={buyAgain} onChat={chat} onShop={openShop} onGo={go} onViewChange={setAcctView} onLogout={logout} />;
  else if (screen === 'tracking') body = <window.LZOrderTracking orderId={trackId} onBack={() => goAccount('orders')} onReview={review} onChat={chat} />;
  else if (screen === 'shop') body = <window.LZShop vendorId={shopId} onOpen={open} onSearch={runSearch} onChat={chat} />;
  else if (screen === 'search') body = <window.LZSearch query={query} scope={searchScope} shopId={searchShopId} onOpen={open} onScope={setSearchScope} onShop={openShop} />;
  else if (screen === 'seller') body = <window.LZBecomeSeller onLogin={toLogin} onRegistered={() => { window.location.href = '../vendor/index.html?screen=kyc'; }} />;
  else if (screen === 'page') body = <window.LZPolicyPage pageId={pageId} onNav={(id) => go('page', id)} />;
  else if (screen === 'category') body = <window.LZCategory categoryName={catName} onOpen={open} onHome={() => go('home')} onCategory={openCategory} />;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      <Header cart={cart} cartCount={cartCount} loggedIn={loggedIn} onNav={go} onOpen={open} onOrders={() => goAccount('orders')} onNotifications={() => goAccount('notifications')} onOpenNotif={(n) => { setPendingNotif(n); goAccount('notifications'); }} query={query} onSearch={(q) => runSearch(q, null)} onCategory={openCategory} onRequireLogin={requireLogin} onLogin={toLogin} onLogout={logout} />
      <main style={{ flex: 1 }}>{body}</main>
      <Footer onNavPage={(id) => go('page', id)} />
      <window.LZChatWidget />
      <window.LZReviewModal open={!!reviewOrder} order={reviewOrder} onClose={() => setReviewOrder(null)} onSubmitted={() => { setReviewedIds((r) => [...r, reviewOrder.id]); setReviewOrder(null); showToast('Cảm ơn bạn đã đánh giá sản phẩm!'); }} />
      {toast && (
        <div role="status" style={{ position: 'fixed', top: 32, right: 32, zIndex: 9999, display: 'flex', alignItems: 'center', gap: 12, background: '#fff', color: 'var(--text-strong)', padding: '14px 24px', borderRadius: 8, boxShadow: '0 4px 12px rgba(0,0,0,.15)', border: '1px solid var(--border-default)', animation: 'lzSlideDown .25s var(--ease-out)' }}>
          <Icon name={toast.type === 'error' ? 'circle-alert' : 'info'} size={22} style={{ color: toast.type === 'error' ? 'var(--red-500)' : 'var(--color-primary)' }} />
          <span style={{ font: 'var(--weight-medium) 15px var(--font-sans)' }}>{toast.message}</span>
        </div>
      )}
      {loginPrompt && <LoginPrompt onClose={() => setLoginPrompt(false)} onLogin={toLogin} />}
    </div>
  );
}

function LoginPrompt({ onClose, onLogin }) {
  const { Button } = window.LazadeeDesignSystem_0477b7;
  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.6)', zIndex: 9999, display: 'grid', placeItems: 'center' }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: 340, background: '#fff', borderRadius: 'var(--radius-lg)', padding: 24, textAlign: 'center', boxShadow: 'var(--shadow-xl)' }}>
        <Icon name="user" size={46} style={{ color: 'var(--text-muted)', marginBottom: 14 }} />
        <div style={{ font: 'var(--weight-bold) 18px var(--font-sans)', color: 'var(--text-strong)', marginBottom: 8 }}>Vui lòng đăng nhập</div>
        <div style={{ font: '14px var(--font-sans)', color: 'var(--text-muted)', marginBottom: 22, lineHeight: 1.5 }}>Bạn cần đăng nhập để thực hiện tính năng này.</div>
        <div style={{ display: 'flex', gap: 12 }}>
          <Button variant="secondary" style={{ flex: 1 }} onClick={onClose}>Để sau</Button>
          <Button style={{ flex: 1 }} onClick={onLogin}>Đăng nhập</Button>
        </div>
      </div>
    </div>
  );
}

// Receipt after a successful checkout: one row per shop + totals. Opened directly it shows a sample.
const SAMPLE_RECEIPT = {
  sessionId: 'CS-8F21A',
  orders: [{ id: 'ORD-2412-0044', vendorId: 'techzone', grandTotal: 813000 }, { id: 'ORD-2412-0041', vendorId: 'beauty', grandTotal: 399000 }],
  price: { subtotal: 1261000, shipping: 41000, platformDisc: 60000, freeshipDisc: 30000, shopDisc: 0, xuDiscount: 0, total: 1212000 },
};
function OrderDone({ receipt, onHome, onOrders, onTrack }) {
  const { Button, Money } = window.LazadeeDesignSystem_0477b7;
  const r = receipt || SAMPLE_RECEIPT;
  const f = Money.format, p = r.price;
  const disc = p.platformDisc + p.freeshipDisc + p.shopDisc;
  const row = { display: 'flex', justifyContent: 'space-between', marginBottom: 12, font: 'var(--type-body-sm)', color: 'var(--text-body)' };
  const kicker = { font: 'var(--type-caption)', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 4 };
  return (
    <div style={{ maxWidth: 640, margin: '0 auto', padding: '56px 24px' }}>
      <div style={{ textAlign: 'center', marginBottom: 28 }}>
        <div style={{ width: 72, height: 72, borderRadius: '50%', background: 'var(--green-50)', color: 'var(--green-600)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
          <Icon name="circle-check" size={42} strokeWidth={2} />
        </div>
        <h1 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 6 }}>Thanh toán thành công!</h1>
        <p style={{ color: 'var(--text-muted)' }}>{r.orders.length > 1 ? 'Đơn hàng đã được tách theo từng nhà bán hàng.' : 'Cảm ơn bạn đã mua sắm tại Lazadee.'}</p>
      </div>
      <div style={{ background: '#fff', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-lg)', padding: '24px 28px', boxShadow: 'var(--shadow-sm)', marginBottom: 28 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px dashed var(--border-subtle)', paddingBottom: 18, marginBottom: 18 }}>
          <div><div style={kicker}>Mã giao dịch</div><div className="code" style={{ font: '600 15px var(--font-mono)', color: 'var(--text-strong)' }}>{r.sessionId}</div></div>
          <div style={{ textAlign: 'right' }}><div style={kicker}>Ngày đặt</div><div style={{ font: 'var(--weight-medium) 15px var(--font-sans)', color: 'var(--text-strong)' }}>{new Date().toLocaleDateString('vi-VN')}</div></div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 20 }}>
          {r.orders.map((o) => (
            <div key={o.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
              <div>
                <div className="code" style={{ font: 'var(--weight-medium) 14px var(--font-mono)', color: 'var(--text-strong)', marginBottom: 2 }}>Đơn {o.id}</div>
                <div style={{ font: 'var(--type-caption)', color: 'var(--text-muted)' }}>Cung cấp bởi: {window.LZ.V[o.vendorId].name}</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <span style={{ font: 'var(--weight-semibold) 15px var(--font-sans)', color: 'var(--text-strong)' }}>{f(o.grandTotal)}</span>
                <Button size="sm" variant="outline" onClick={() => onTrack(o.id)}>Theo dõi</Button>
              </div>
            </div>
          ))}
        </div>
        <div style={{ borderTop: '1px solid var(--border-subtle)', paddingTop: 18 }}>
          <div style={row}><span>Tổng tiền hàng (Tạm tính)</span><span>{f(p.subtotal)}</span></div>
          <div style={row}><span>Phí vận chuyển</span><span>{f(p.shipping)}</span></div>
          {disc > 0 && <div style={{ ...row, color: 'var(--mint-600)' }}><span>Giảm giá (Voucher & Khuyến mãi)</span><span>−{f(disc)}</span></div>}
          {p.xuDiscount > 0 && <div style={{ ...row, color: 'var(--orange-600)' }}><span>Dùng Lazadee Xu</span><span>−{f(p.xuDiscount)}</span></div>}
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 14, paddingTop: 14, borderTop: '1px dashed var(--border-subtle)', font: '700 18px var(--font-sans)', color: 'var(--orange-600)' }}><span>Tổng thanh toán</span><span>{f(p.total)}</span></div>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
        <Button size="lg" variant="outline" onClick={onHome} iconLeft="house">Về trang chủ</Button>
        <Button size="lg" onClick={onOrders} iconLeft="package">Xem đơn mua</Button>
      </div>
    </div>
  );
}

function PaymentFailed({ onRetry, onCart, onHome }) {
  const { Button, Icon: I, StatusBadge } = window.LazadeeDesignSystem_0477b7;
  return (
    <div style={{ maxWidth: 640, margin: '0 auto', padding: '64px 24px', textAlign: 'center' }}>
      <div style={{ width: 88, height: 88, borderRadius: '50%', background: 'var(--red-50, #FDECEA)', color: 'var(--red-600)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 22px' }}>
        <I name="circle-alert" size={52} strokeWidth={2} />
      </div>
      <h1 style={{ font: 'var(--type-h2)', color: 'var(--text-strong)', marginBottom: 10 }}>Thanh toán thất bại</h1>
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 14 }}><StatusBadge status="ERROR" label="PAYMENT_FAILED" /></div>
      <p style={{ color: 'var(--text-muted)', marginBottom: 6 }}>Cổng thanh toán không thể xử lý giao dịch (thẻ bị từ chối hoặc hết thời gian chờ). <b>Bạn chưa bị trừ tiền.</b></p>
      <p style={{ color: 'var(--text-muted)', marginBottom: 24 }}>Đơn hàng <span className="code">ORD-2412-0045</span> đang ở trạng thái <b>PENDING_PAYMENT</b>.</p>
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'var(--amber-50)', color: 'var(--amber-600)', borderRadius: 'var(--radius-md)', padding: '10px 16px', font: 'var(--type-body-sm)', marginBottom: 28 }}>
        <I name="lock" size={16} /> Tồn kho vẫn được giữ thêm <b>13:54</b> — hãy thử lại trước khi hết hạn để không mất hàng.
      </div>
      <div style={{ display: 'flex', gap: 12, justifyContent: 'center', flexWrap: 'wrap' }}>
        <Button size="lg" iconLeft="refresh-cw" onClick={onRetry}>Thử thanh toán lại</Button>
        <Button size="lg" variant="outline" iconLeft="credit-card" onClick={onRetry}>Đổi phương thức</Button>
        <Button size="lg" variant="ghost" iconLeft="shopping-cart" onClick={onCart}>Về giỏ hàng</Button>
      </div>
    </div>
  );
}

function Footer({ onNavPage }) {
  const cols = window.LZ_PAGE_GROUPS;
  return (
    <footer style={{ background: '#fff', borderTop: '4px solid var(--color-primary)', marginTop: 20 }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: '36px 24px', display: 'grid', gridTemplateColumns: '1.4fr repeat(' + cols.length + ', 1fr)', gap: 28 }}>
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
            <img src="../../assets/logomark.svg" width="32" height="32" alt="" />
            <span style={{ font: '800 22px var(--font-sans)', letterSpacing: '-0.02em', color: 'var(--text-strong)' }}>lazadee</span>
          </div>
          <p style={{ font: 'var(--type-body-sm)', color: 'var(--text-muted)', maxWidth: 260 }}>Sàn thương mại điện tử đa người bán. Mua sắm an tâm với thanh toán giữ tạm (escrow) và đổi trả trong 7 ngày.</p>
        </div>
        {cols.map((g) => (
          <div key={g.title}>
            <div style={{ font: 'var(--weight-bold) var(--text-sm) var(--font-sans)', color: 'var(--text-strong)', textTransform: 'uppercase', letterSpacing: '.04em', marginBottom: 14 }}>{g.title}</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              {g.pages.map((p) => <a key={p.id} onClick={() => onNavPage(p.id)} style={{ font: 'var(--type-body-sm)', color: 'var(--text-muted)', textDecoration: 'none', cursor: 'pointer' }} onMouseEnter={(e) => (e.currentTarget.style.color = 'var(--color-primary)')} onMouseLeave={(e) => (e.currentTarget.style.color = 'var(--text-muted)')}>{p.name}</a>)}
            </div>
          </div>
        ))}
      </div>
      <div style={{ borderTop: '1px solid var(--border-subtle)', padding: '16px 24px', textAlign: 'center', font: 'var(--type-caption)', color: 'var(--text-subtle)' }}>© 2026 Lazadee. Demo design-system recreation. Giá hiển thị bằng VND (₫).</div>
    </footer>
  );
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <!-- The Genie lamp in brass with turquoise smoke rising from the spout. The smoke flows and
       sways; puffs drift up and fade. Motion stops under prefers-reduced-motion. -->
  <style>
    .ribbon { animation: breathe 3.6s ease-in-out infinite alternate; }
    .ribbon.b { animation-duration: 4.6s; animation-direction: alternate-reverse; }
    .flow { stroke-dasharray: 26 18; animation: flow 4s linear infinite; }
    .sway { transform-origin: 318px 345px; animation: sway 5s ease-in-out infinite alternate; }
    .puff { animation: puff 4.8s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .puff.p2 { animation-delay: 1.6s; } .puff.p3 { animation-delay: 3.2s; }
    @keyframes flow { to { stroke-dashoffset: -176; } }
    @keyframes breathe { from { stroke-opacity: .28; } to { stroke-opacity: .55; } }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: .7; } 100% { opacity: 0; transform: translate(-70px, -250px) scale(1.6); } }
    @media (prefers-reduced-motion: reduce) { .flow, .ribbon, .sway, .puff { animation: none; } .puff { opacity: 0; } }
  </style>
  <g class="sway" stroke-linecap="round">
    <path class="ribbon" d="M318 345C302 302 338 272 308 228C278 184 318 152 276 112C246 84 262 50 232 22" stroke="#2BB3B1" stroke-opacity=".42" stroke-width="24"/>
    <path class="ribbon b" d="M318 345C330 306 290 286 300 246C310 206 268 190 270 150C272 116 240 100 226 68" stroke="#8FDCD8" stroke-opacity=".55" stroke-width="15"/>
    <path class="ribbon" d="M318 345C306 318 326 296 308 268C292 244 316 224 298 196C288 180 296 164 286 150" stroke="#1B8A8F" stroke-opacity=".6" stroke-width="6"/>
  </g>
  <circle class="puff" cx="318" cy="330" r="12" fill="#8FDCD8"/>
  <circle class="puff p2" cx="322" cy="334" r="9" fill="#2BB3B1"/>
  <circle class="puff p3" cx="314" cy="332" r="11" fill="#8FDCD8"/>
  <g transform="translate(70 250) scale(4.2)">
    <g fill="#C99232">
      <path d="M5 33h38c0 8.6-8.5 14.5-19 14.5S5 41.6 5 33Z"/>
      <path d="M40 38.5c6.5-.5 11-4.5 14.5-10.5l2.6-4.4c.9-1.5 3-.8 2.6.9L56.5 34C53.6 41 47.5 45 40.5 45.5Z"/>
      <path d="M13 33a11 8 0 0 1 22 0Z"/>
      <path d="M19 47h10v5H19z"/>
      <rect x="12" y="52" width="24" height="6" rx="3"/>
    </g>
    <path d="M9 36c3 5 9 8 15 8" stroke="#F1CF7A" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 31a8 5 0 0 1 6-4" stroke="#F1CF7A" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="24" cy="23" r="3.2" fill="#2BB3B1"/>
    <path d="M6.5 36.5c-6 .5-6 9.5 2.5 9.5" stroke="#C99232" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
